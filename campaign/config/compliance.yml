allowed_organization_types:
  - company
  - standards_organization
  - industry_association
  - open_source_foundation
  - open_source_project
  - open_source_company
  - university
  - research_laboratory
  - accelerator
  - grant_program
require_public_contact_evidence: true
require_source_and_lawful_basis: true
require_postal_address: true
require_opt_out: true
personal_email_domains: [gmail.com, yahoo.com, outlook.com, hotmail.com, proton.me, icloud.com]
geographic_exclusions: []
legal_review_regions:
  - EU_WITHOUT_EXPLICIT_CONSENT
  - GB_NON_CORPORATE_SUBSCRIBER
  - CA_WITHOUT_PUBLICATION_EVIDENCE
  - JP_WITHOUT_PUBLICATION_EVIDENCE
  - KR_WITHOUT_EXPLICIT_CONSENT
  - UA_WITHOUT_LOCALIZED_OPT_OUT_BASIS
  - IL_WITHOUT_EXPLICIT_CONSENT
  - AU_WITHOUT_INFERRED_CONSENT_EVIDENCE
  - UNKNOWN
prohibited_claim_patterns:
  - guaranteed fraud reduction
  - clinically proven
  - regulatory approved
  - production ready
  - MRC accredited
  - IAB certified
  - military deployed
  - proven ROI
  - customers include
  - patented
