[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jneo-campaign"
version = "0.1.0"
description = "Evidence-grounded, compliance-gated campaign automation for Jneopallium"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "bleach>=6.1,<7",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.149,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2,<4",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
jneo-campaign = "jneo_campaign.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jneo_campaign"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["live: requires explicit credentials and JNEO_ENABLE_LIVE_TESTS=true"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501"]
